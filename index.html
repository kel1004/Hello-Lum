<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000; /* Match your background color */
    }

    .canva-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Pushes the iframe down by 100px to completely hide the Canva control bar */
    .canva-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + 100px);
      border: none;
    }

    /* A solid block at the very bottom to physically cover any flickering edges */
    .blocker-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 15px;
      background-color: #000000; /* Match background (#ffffff if your slide is white) */
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="canva-wrapper">
    <iframe 
      loading="lazy" 
      src="https://www.canva.com/design/DAHYzzzCBv4/fqAyowpgpwOJKv7PrNGGLw/view?embed" 
      allowfullscreen="allowfullscreen" 
      allow="fullscreen">
    </iframe>
    <!-- This bar physically blocks the bottom edge -->
    <div class="blocker-bar"></div>
  </div>
  <!-- Background Audio -->
  <audio id="bg-music" src="music.mp3" loop></audio>

  <!-- Floating Sound Toggle Button in Top-Right Corner -->
  <button id="music-btn" onclick="toggleMusic()" style="
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10000;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 50px;
    padding: 10px 16px;
    cursor: pointer;
    font-family: sans-serif;
    font-size: 14px;
  ">
    🔇 Play Music
  </button>

  <script>
    const music = document.getElementById('bg-music');
    const btn = document.getElementById('music-btn');

    function toggleMusic() {
      if (music.paused) {
        music.play();
        btn.innerHTML = '🔊 Mute Music';
      } else {
        music.pause();
        btn.innerHTML = '🔇 Play Music';
      }
    }
  </script>
  
</body>
</html>
