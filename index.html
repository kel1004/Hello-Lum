<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admurulum</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }

    .canva-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Keep iframe at 100% height so the Unmute button isn't cut off */
    .canva-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Covers the progress line, slide arrows, and right-side icons */
    /* Leaves a 65px opening on the bottom-left for the Unmute icon */
    .nav-shield {
      position: absolute;
      bottom: 0;
      left: 65px; /* Leaves the bottom-left 65px open for the speaker button */
      width: calc(100% - 65px);
      height: 55px; /* Covers the bottom control bar and scrubber line */
      background-color: #000000; /* Change to match your slide background color if preferred */
      z-index: 99999;
      pointer-events: auto; /* CRITICAL: Absorbs clicks so users cannot click the arrows or scrubber line */
      cursor: default;
    }
  </style>
</head>
<body>

  <div class="canva-wrapper">
    <iframe 
      src="https://www.canva.com/design/DAHYzzzCBv4/fqAyowpgpwOJKv7PrNGGLw/view?embed" 
      allowfullscreen="allowfullscreen" 
      allow="autoplay; fullscreen">
    </iframe>
    
    <!-- Physically blocks clicks on the slide controls while leaving Unmute open -->
    <div class="nav-shield"></div>
  </div>

</body>
</html>
